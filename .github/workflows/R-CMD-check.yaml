name: R package validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R ${{ matrix.r-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ["4.4.1", "4.5.1", "release"]
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Verify dictionary, test, and check package
        run: make check
      - name: Build offline source bundle
        if: matrix.r-version == 'release'
        run: Rscript scripts/build_offline_bundle.R
      - uses: actions/upload-artifact@v4
        if: matrix.r-version == 'release'
        with:
          name: reactextract-offline-source
          path: dist/reactextract-*-offline
          if-no-files-found: error
